name: server-build
on:
    push:
        branches:
            - main
            - master
    workflow_dispatch:

env:
    REGISTRY: docker.kensa.fr
    IMAGE: kensa-minecraft-launcher-server
    REGISTRY_USER: ${{ secrets.REGISTRY_USERNAME }}
    REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

jobs:
    version-check:
        name: Version Checking
        runs-on: [self-hosted]
        container:
            image: docker.kensa.fr/electron-build-image
            credentials:
                username: ${{ secrets.REGISTRY_USERNAME }}
                password: ${{ secrets.REGISTRY_PASSWORD }}
            options: --user 1000:1000
        outputs:
            needs_update: ${{ steps.needs-update.outputs.needs_update }}
            version: ${{ steps.get-project-version.outputs.version }}
        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: get-pkgversion
              id: get-project-version
              working-directory: server
              run: |
                  version=$(cat package.json | jq -r ".version")
                  echo $version
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: needs-update
              id: needs-update
              run: |
                  needs_update=$(curl -fsSL -u "$REGISTRY_USER:$REGISTRY_PASSWORD" "https://$REGISTRY/v2/$IMAGE/tags/list" | jq --arg tag "${{ steps.get-project-version.outputs.version }}" '.tags | index($tag) == null')
                  echo $needs_update
                  echo "needs_update=$needs_update" >> "$GITHUB_OUTPUT"
    build:
        name: Build
        runs-on: [self-hosted]
        permissions: write-all
        needs: version-check
        if: ${{ needs.version-check.outputs.needs_update == 'true' || github.event_name == 'workflow_dispatch' }}
        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: Login to registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ env.REGISTRY_USER }}
                  password: ${{ env.REGISTRY_PASSWORD }}

            - name: build
              run: |
                  docker buildx build -t $REGISTRY/$IMAGE:${{ needs.version-check.outputs.version }} -t $REGISTRY/$IMAGE:latest .
                  docker push $REGISTRY/$IMAGE:${{ needs.version-check.outputs.version }}
                  docker push $REGISTRY/$IMAGE:latest
